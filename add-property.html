<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Property — Kosmos</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"><style>body{font-family:'DM Sans'}h1,.brand{font-family:'Cormorant Garamond'}.field{width:100%;padding:14px;border:1px solid #d8c896}</style></head><body class="bg-[#f5f0e8]"><nav class="p-6 border-b border-[#c9a84c]/30 flex justify-between"><a class="brand text-2xl" href="index.html">Kosmos <span class="text-[#c9a84c]">Properties</span></a><a href="dashboard.html">Dashboard</a></nav><main class="max-w-3xl mx-auto p-6 py-12"><h1 class="text-4xl mb-8">Submit a property</h1><form id="propertyForm" class="bg-white p-7 grid md:grid-cols-2 gap-5"><input id="title" class="field md:col-span-2" placeholder="Property title" required><input id="country" class="field" placeholder="Country" required><input id="city" class="field" placeholder="City" required><select id="type" class="field" required><option value="">Property type</option><option>Villa</option><option>Apartment</option><option>House</option><option>Commercial</option><option>Land</option></select><select id="listingType" class="field"><option>For Sale</option><option>For Rent</option></select><input id="price" type="number" class="field" placeholder="Price" required><select id="currency" class="field"><option>EUR</option><option>USD</option><option>CHF</option><option>GBP</option><option>AED</option></select><input id="bedrooms" type="number" class="field" placeholder="Bedrooms"><input id="bathrooms" type="number" class="field" placeholder="Bathrooms"><input id="size" class="field md:col-span-2" placeholder="Size, e.g. 350 m²"><textarea id="description" class="field md:col-span-2" rows="6" placeholder="Description" required></textarea><input id="image" type="file" accept="image/*" class="field md:col-span-2" required><button class="md:col-span-2 bg-black text-white py-4 uppercase tracking-widest text-xs">Submit property</button><p id="message" class="md:col-span-2"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="add-property.js"></script></body></html>
